packages:
  - vendor/*
  # Harness packages vendored from dsh, mirroring its own packages/<group>/<pkg>
  # layout so a sync is a straight per-path copy.
  - vendor/dsh/*/*
  - packages/*/*
  - apps/*
  # Runnable example trees join as ONE member: examples/package.json declares
  # the union of every leaf's cordis.yml plugins, so booting a leaf resolves
  # them by walking up to examples/node_modules. Resolution only, not a build
  # target.
  - examples

# Vendored framework packages keep their upstream semver ranges; local builds
# must resolve those names to this workspace's pinned sources.
linkWorkspacePackages: true

# pnpm blocks dependencies shipping install scripts until reviewed here.
# Deny by default; every entry below is an explicit review.
allowBuilds:
  # hmr imports only esbuild's `BuildFailure` TYPE (vendor/hmr/src/error.ts).
  # No runtime use, so its native binary download is dead weight.
  esbuild: false
  # koffi is a Windows-only lazy import: session-persistence-jsonl/src/win32.ts
  # loads it to call kernel32.dll for file locking. Never reached on darwin or
  # linux, so its native build is dead weight. Flip to true for a Windows demo.
  koffi: false

  # node-pty: a top-level import in subprocess-local, which every shell tool
  # runs through. A native build, and unavoidable -- there is no second
  # subprocess provider upstream.
  node-pty: true

  # @vscode/ripgrep: postinstall downloads the ripgrep binary that tool-fs-search
  # shells out to. No binary, no grep or glob tool.
  '@vscode/ripgrep': true

  # @modelcontextprotocol/sdk: the one real third-party dependency the MCP
  # client brings. Neither it nor anything in its closure ships an install or
  # postinstall script -- the `prepare` scripts several of them declare are
  # never run for a registry tarball. Recorded as an explicit deny anyway,
  # because an undecided build is a boot that stops on a prompt, and the SDK is
  # on the path of a demo where that failure would be invisible until it wasn't.
  '@modelcontextprotocol/sdk': false
