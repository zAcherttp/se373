# The `standard` agent preset: the full coding agent, mounted once per process.
#
# This file is an AGENT-PLANE composition, transcribed from dsh's own `standard`
# preset and restricted to what we vendor. The roster mounts it once under a
# standing scope; every session naming it joins by scope parentage, so the tools
# and prompt sections registered here cover each joined agent while a session's
# own state stays keyed per Session/Agent inside the plugins.
#
# The host composition (`examples/web/cordis.yml`) keeps everything a preset
# must not own: the registries themselves, the sandbox and approval stack,
# persistence, and the model route.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global --
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session. `agent-presets` rejects that
# at mount.

# --- identity ----------------------------------------------------------------

- id: persona
  name: '@se373/persona'
  config:
    text: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@se373/agent-instructions'
  config:
    maxBytes: 65536

# --- shell -------------------------------------------------------------------
#
# `shell-env` stays in the HOST composition: a host row that injects a service
# is the criterion for host-plane ownership, and behind a preset realm those
# variables would never reach the model's shell. The executor
# (`bash-sandbox`) is host-plane too; this is only the model-facing tool.

- id: tool-bash
  name: '@se373/tool-bash'
  disabled: !!js process.platform === 'win32'

# --- filesystem --------------------------------------------------------------
#
# Both register into the host `tools` registry and provide nothing, so they
# need no realm. The `fs` service and its policy stay in the host.

- id: tool-fs
  name: '@se373/tool-fs'

- id: tool-fs-search
  name: '@se373/tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-str-replace-editor
  name: '@se373/tool-str-replace-editor'
  config:
    maxOutputChars: 16000

- id: tool-todo
  name: '@se373/tool-todo'
  config:
    allowParallelInProgress: true

# --- background jobs ---------------------------------------------------------
#
# Only the model-facing controls. The job REGISTRY stays on the host plane: its
# producers sit outside any realm this file could put it in, and an entry-local
# realm here would be invisible to them. What a preset chooses is whether its
# agent can collect and stop background work at all.

- id: tool-jobs
  name: '@se373/tool-jobs'

# --- skills ------------------------------------------------------------------
#
# The skill REGISTRY lives in the host composition and is layered per scope, so
# these rows register into THIS preset's layer and need no realm.

- id: skill-filesystem
  name: '@se373/skill-filesystem'

- id: tool-skill
  name: '@se373/tool-skill'

# --- goals -------------------------------------------------------------------
#
# Only the model-facing tool. The goal SERVICE, its session driver and the
# `/goal` command stay on the host plane, because the gateway serves the goal
# domain as Remote endpoints that resolve `goals` on the host.

- id: tool-goal
  name: '@se373/tool-goal'

# --- our own -----------------------------------------------------------------
#
# The runtime inspector is a preset choice like any other tool: an agent that
# is meant to reason about its own composition gets it, and one that is not
# does not. See the `inspect` preset for the other half of that sentence.

- id: tool-graph-inspect
  name: '@se373/tool-graph-inspect'

# --- compaction --------------------------------------------------------------
#
# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
# must share this realm rather than sit outside it. `tokenMeter` is deliberately
# NOT in it: the meter stays host-plane and owns projection units the browser
# reads for every session, which behind a realm would come and go with whichever
# presets happen to be mounted.

- id: compaction
  name: '@se373/cordis-plugin-group'
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@se373/compaction-basic'

    - id: command-compact
      name: '@se373/command-compact'

    - id: tool-result-pruner
      name: '@se373/compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# --- delegation --------------------------------------------------------------
#
# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `tool-subagent-report` is host-plane for the same reason as the registry, and
# not because a preset may not want it: it registers a continuable SETUP on that
# singleton rather than a tool this agent calls, and the setup list is not
# scope-aware -- one copy per mounted preset means every child gets `report`
# registered once per live session, which throws on the second.

- id: tool-subagent-control
  name: '@se373/tool-subagent-control'

- id: tool-subagent-list-agents
  name: '@se373/tool-subagent-control/list-agents'

- id: tool-subagent
  name: '@se373/tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable

- id: tool-subagent-fork
  name: '@se373/tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: continuable

# `plan-mode` is absent here for the same reason it is absent from the host
# tree: its whole configuration is the prompt section it injects, and that
# section is upstream's product writing rather than a default we can supply.
